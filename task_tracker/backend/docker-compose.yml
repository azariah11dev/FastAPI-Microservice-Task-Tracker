services:
  postgres:
    image: postgres:16
    container_name: TaskForgeDB_Postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: deep_value
      POSTGRES_DB: TaskForgeDB
    ports:
      - "5432:5432"
    volumes:
      - TaskForgeDB_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: TaskForge_App
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:deep_value@postgres:5432/TaskForgeDB
      PYTHONPATH: /app/src
    working_dir: /app
    ports:
      - "8000:8000"

volumes:
  TaskForgeDB_pgdata: