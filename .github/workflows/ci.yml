name: CI Pipeline

on:
  push:
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install backend dependencies
        working-directory: task_tracker/backend
        run: uv sync --dev

      - name: Run backend tests
        working-directory: task_tracker/backend
        run: pytest

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        working-directory: task_tracker/frontend
        run: npm install

      - name: Run frontend tests
        working-directory: task_tracker/frontend
        run: npm test

  playwright-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        working-directory: task_tracker/frontend
        run: npm install

      - name: Install Playwright browsers
        working-directory: task_tracker/frontend
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        working-directory: task_tracker/frontend
        run: npx playwright test

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker images
        run: docker build -t taskforge-backend ./task_tracker/backend
